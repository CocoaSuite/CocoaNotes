<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>CocoaNotes</title>
<meta name="description" content="Handwritten notes for college: journals, endless canvases, real pens. Works offline.">
<meta name="theme-color" content="#1a1a1a">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CocoaNotes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="app">

<section id="lib" class="screen">
  <header class="top">
    <button class="ic mo" id="libMenu" aria-label="Subjects"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="brand"><svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="17.5" fill="#2B1A0E"/><g transform="translate(23 21) scale(1.036)"><path d="M44 6C39.5 1.9 34.5 0 28 0C12.5 0 0 12.5 0 28C0 43.5 12.5 56 28 56C34.5 56 39.5 54.1 44 50L36 40C33.8 42 31.3 43 28 43C19.7 43 13 36.3 13 28C13 19.7 19.7 13 28 13C31.3 13 33.8 14 36 16L44 6Z" fill="#F5A15C"/><path d="M21 34 L34 21" stroke="#F5A15C" stroke-width="5" stroke-linecap="round"/><circle cx="46" cy="28" r="4" fill="#F5A15C"/></g></svg><span>CocoaNotes</span></div>
    <label class="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM20 20l-4-4"/></svg><input id="q" type="search" placeholder="Search notes" aria-label="Search notes" autocomplete="off"></label>
    <span class="sp"></span>
    <button id="syncChipL" class="chip sync"></button>
    <button class="ic" id="openSettings" aria-label="Settings" title="Settings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2zM12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg></button>
    <button class="pri" id="newBtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New</span></button>
  </header>
  <div class="libBody">
    <nav id="side" aria-label="Library"></nav>
    <div id="sideScrim" class="scrim"></div>
    <main id="grid"></main>
  </div>
</section>

<section id="ed" class="screen" hidden>
  <header class="top">
    <button class="back" id="edBack"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span>Library</span></button>
    <span class="vsep"></span>
    <button id="edTitle" class="title" title="Rename"></button>
    <span id="edSubj" class="subjChip" hidden></span>
    <span class="sp"></span>
    <span class="grp"><button class="ic" id="undo" aria-label="Undo" title="Undo"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="ic" id="redo" aria-label="Redo" title="Redo"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></svg></button></span>
    <button class="ic jOnly" id="railBtn" aria-label="Page list" title="Page list" aria-controls="rail"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM4 13h7v7H4zM14 5h6M14 9h6M14 15h6M14 19h6"/></svg></button>
    <button id="liningBtn" class="lining"><span class="lnI"></span><span id="liningLbl">Lining</span><svg class="i s16" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="ic jOnly" id="addPage" aria-label="Add page" title="Add page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM12.5 10v7M9 13.5h7"/></svg></button>
    <button class="ic" id="exportBtn" aria-label="Export and more" title="Export and more"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
    <button id="syncChip" class="chip sync"></button>
    <button class="ic" id="edMore" aria-label="More" title="More"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/></svg></button>
  </header>
  <div class="edBody">
    <aside id="rail" aria-label="Pages">
      <div class="ph"><span>Pages</span><button class="ic sm" id="railClose" aria-label="Hide page list" title="Hide page list"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button></div>
      <div id="pages"></div>
    </aside>
    <div id="railScrim" class="scrim"></div>
    <div id="stage">
      <div id="surface" data-tool="pen">
        <canvas id="cMain"></canvas>
        <canvas id="cInk"></canvas>
      </div>
      <div id="sel" hidden><button id="selHandle" aria-label="Resize selection"></button></div>
      <div id="selBar" class="fbar" role="toolbar" aria-label="Selection" hidden>
        <button id="selEdit" hidden>Edit text</button>
        <button id="selCopy">Copy</button>
        <button id="selDup">Duplicate</button>
        <button id="selColor">Color</button>
        <button id="selDel" class="danger">Delete</button>
      </div>
      <div id="textBox" hidden><textarea id="textArea" rows="1" spellcheck="true" aria-label="Text"></textarea><span id="textGrip" title="Drag to change width"></span></div>
      <div id="textBar" class="fbar" role="toolbar" aria-label="Text style" hidden>
        <div class="seg"><button data-font="sans">Sans</button><button data-font="serif">Serif</button><button data-font="hand">Hand</button><button data-font="mono">Mono</button></div>
        <button id="tMinus" aria-label="Smaller">A−</button><span id="tSize" class="tsz">22</span><button id="tPlus" aria-label="Bigger">A+</button>
        <button id="tBold" aria-label="Bold"><b>B</b></button>
        <button id="tColor" class="tcol" aria-label="Text color"></button>
        <button id="tDone" class="pri">Done</button>
      </div>
      <button id="addBelow" class="addBelow" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add page</button>
      <div id="pageChip" class="fchip"></div>
      <div id="zoomBox" class="float zoom">
        <button class="ic" id="zOut" aria-label="Zoom out"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <span id="zoomLbl">100%</span>
        <button class="ic" id="zIn" aria-label="Zoom in"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="ic" id="zFit" aria-label="Fit" title="Fit"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div id="tray" class="tray bottom" role="toolbar" aria-label="Pens and tools"></div>
    </div>
  </div>
</section>

<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="filePick" accept="image/*" multiple hidden>
<div id="print" aria-hidden="true"></div>
</div>
</body>
</html>
